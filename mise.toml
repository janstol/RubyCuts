[tools]
ruby = "3.4"

# Shared xcodebuild arguments for the tasks below. macOS builds need
# -allowProvisioningUpdates because the iCloud entitlement requires a real
# provisioning profile. The iOS Simulator name can be overridden per machine
# with IOS_SIM, e.g. `IOS_SIM="iPhone 18 Pro" mise run test:ios`.
[vars]
project = "-project RubyCuts.xcodeproj -scheme RubyCuts"
macos = "-destination 'platform=macOS' -allowProvisioningUpdates"
ios = "-destination \"platform=iOS Simulator,name=${IOS_SIM:-iPhone 17}\""

[tasks.cruby]
description = "Build the embedded CRuby into Vendor/CRuby (slow, run once)"
run = "ruby scripts/build-cruby.rb"

[tasks."cruby:clean"]
description = "Wipe and rebuild the embedded CRuby from scratch"
run = "ruby scripts/build-cruby.rb --clean"

[tasks.build]
description = "Build the app for macOS"
run = "xcodebuild {{vars.project}} {{vars.macos}} build"

[tasks."build:ios"]
description = "Build the app for the iOS Simulator (IOS_SIM overrides the device)"
run = "xcodebuild {{vars.project}} {{vars.ios}} build"

[tasks."install:device"]
description = "Build a Debug \"RubyCuts Dev\" (dev.stol.RubyCuts.dev) and install it on a connected iPhone, alongside the TestFlight app; IOS_DEVICE=<UDID> picks the device"
run = '''
set -euo pipefail
device="${IOS_DEVICE:-}"
if [ -z "$device" ]; then
  json=$(mktemp)
  trap 'rm -f "$json"' EXIT
  xcrun devicectl list devices --json-output "$json" >/dev/null
  device=$(ruby -rjson -e '
    devices = JSON.parse(File.read(ARGV[0])).dig("result", "devices") || []
    phone = devices.find do |d|
      d.dig("hardwareProperties", "platform") == "iOS" &&
        d.dig("hardwareProperties", "reality") == "physical" &&
        d.dig("connectionProperties", "tunnelState") == "connected"
    end
    puts phone.dig("hardwareProperties", "udid") if phone
  ' "$json")
fi
if [ -z "$device" ]; then echo "No connected iPhone found; set IOS_DEVICE=<UDID> (see: xcrun devicectl list devices)." >&2; exit 1; fi
echo "Installing RubyCuts Dev on $device"
xcodebuild {{vars.project}} -configuration Debug -destination "id=$device" \
  -derivedDataPath build/DevDevice -allowProvisioningUpdates \
  PRODUCT_BUNDLE_IDENTIFIER=dev.stol.RubyCuts.dev \
  INFOPLIST_KEY_CFBundleDisplayName="RubyCuts Dev" \
  -quiet build
xcrun devicectl device install app --device "$device" build/DevDevice/Build/Products/Debug-iphoneos/RubyCuts.app
'''

[tasks.test]
description = "Run unit tests on macOS; optional filter, e.g. RubyCutsTests/ScriptStoreTests or RubyCutsTests/RubyCutsTests/example()"
usage = 'arg "[filter]" default="RubyCutsTests"'
run = 'xcodebuild {{vars.project}} {{vars.macos}} test "-only-testing:${usage_filter}"'

[tasks."test:ios"]
description = "Run unit and UI tests on the iOS Simulator (macOS UI tests need GUI auth)"
run = "xcodebuild {{vars.project}} {{vars.ios}} test"

[tasks."test:a11y"]
description = "Run the accessibility audit UI tests on the iOS Simulator; the issue list is in the failure message and the result bundle"
run = "TEST_RUNNER_A11Y_AUDIT=1 xcodebuild {{vars.project}} {{vars.ios}} test -only-testing:RubyCutsUITests/AccessibilityAuditTests"

[tasks.lint]
description = "swift-format lint on Swift files changed since HEAD, including untracked ones"
run = '''
files=$( { git diff --name-only --diff-filter=ACM HEAD -- '*.swift'; git ls-files --others --exclude-standard -- '*.swift'; } | sort -u )
if [ -z "$files" ]; then echo "No changed Swift files."; exit 0; fi
echo "$files" | xargs swift format lint --configuration .swift-format
'''

[tasks.format]
description = "swift-format the given files in place (new files only)"
run = "swift format format --configuration .swift-format -i"

[tasks.release]
description = "Archive the iOS app and upload it to TestFlight (--no-upload to only archive); needs ASC_KEY_ID/ASC_ISSUER_ID, see scripts/release.sh"
run = "scripts/release.sh"

[tasks.hooks]
description = "Enable the repo's git hooks (advisory swift-format lint on commit)"
run = "git config core.hooksPath .githooks"
